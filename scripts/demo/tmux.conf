# The demo tmux server (tmux -L ca-demo), see sessions.sh. Plain bash with no
# profile or rc, so nothing from the real login (prompt, PATH, history) shows up.
# A non-interactive bash drops PS1, so the prompt rides in DEMO_PS1 to the real shell.
set -g default-command 'PS1="$DEMO_PS1" exec /bin/bash --noprofile --norc'
set -g status off
set -g history-limit 5000
set-environment -g DEMO_PS1 '\[\e[32m\]demo\[\e[0m\]:\[\e[34m\]\w\[\e[0m\]$ '
set-environment -g HISTFILE /dev/null
